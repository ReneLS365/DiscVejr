name: Byg DiscVejr APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - '.source/**'
      - 'discvejr_android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v4

      - name: Udpak oprindelig Android-kildekode ved foerste build
        id: import
        shell: bash
        run: |
          if [ -d discvejr_android ]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
          else
            cat .source/discvejr-source.part0 .source/discvejr-source.part1 | base64 -d > /tmp/discvejr_android_source.tar.xz
            echo 'ea96d452d83fa60cf7c0d47e31668de70be068097075d594b9d0834d97976dda  /tmp/discvejr_android_source.tar.xz' | sha256sum -c -
            tar -xJf /tmp/discvejr_android_source.tar.xz
            test -f discvejr_android/app/build.gradle
            echo "imported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test discgolf-vejrlogik
        shell: bash
        run: |
          mkdir -p /tmp/discvejr-tests
          javac -d /tmp/discvejr-tests discvejr_android/app/src/main/java/dk/discvejr/widget/WeatherLogic.java discvejr_android/tests/WeatherLogicTest.java
          java -cp /tmp/discvejr-tests dk.discvejr.widget.WeatherLogicTest

      - name: Byg signeret debug APK
        working-directory: discvejr_android
        run: gradle --no-daemon assembleDebug

      - name: Laeg Android-kildekode synligt i eget repository
        if: steps.import.outputs.imported == 'true'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discvejr_android
          if ! git diff --cached --quiet; then
            git commit -m "chore: import standalone DiscVejr Android sources"
            git push origin HEAD:main
          fi

      - name: Udgiv APK til installation
        uses: actions/upload-artifact@v4
        with:
          name: DiscVejr-Android-APK
          path: discvejr_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
